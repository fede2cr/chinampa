<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Chinampa</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <!-- ============================= LIST SCREEN ============================ -->
      <section id="screen-list" class="screen">
        <header class="app-header">
          <h1>Chinampa</h1>
          <div class="header-actions">
            <button id="reload" class="ghost" type="button">Reload</button>
            <button id="open-config" class="ghost" type="button">Config</button>
          </div>
        </header>
        <button id="open-create" type="button">+ New tag</button>
        <p id="status-list" class="status" role="status"></p>
        <details id="tags-panel" class="collapsible">
          <summary>Tags</summary>
          <ul id="tags" class="tags"></ul>
        </details>
      </section>

      <!-- ============================ DETAIL SCREEN =========================== -->
      <section id="screen-detail" class="screen hidden">
        <header class="app-header">
          <button id="detail-back" class="ghost" type="button">← Back</button>
          <h1 class="screen-title">Tag <span id="detail-id" class="tag-id"></span></h1>
        </header>
        <dl id="detail-body" class="detail"></dl>
        <p id="status-detail" class="status" role="status"></p>
        <div class="stack-actions">
          <button id="detail-edit" class="ghost" type="button">Edit</button>
          <button id="detail-write" class="write" type="button">Write to NFC</button>
        </div>
      </section>

      <!-- ============================= EDIT SCREEN ============================ -->
      <section id="screen-edit" class="screen hidden">
        <header class="app-header">
          <button id="edit-cancel" class="ghost" type="button">← Cancel</button>
          <h1 class="screen-title">Edit <span id="edit-id" class="tag-id"></span></h1>
        </header>
        <div class="settings">
          <div class="field field-wide">
            <label for="edit-species">Species name</label>
            <input id="edit-species" type="text" autocapitalize="none" spellcheck="false" />
          </div>
          <div class="field">
            <label for="edit-species-inat">Species iNat ID</label>
            <input id="edit-species-inat" type="number" inputmode="numeric" min="0" />
          </div>
          <div class="field">
            <label for="edit-observation">Observation iNat ID</label>
            <input id="edit-observation" type="number" inputmode="numeric" min="0" />
          </div>
          <div class="field">
            <label for="edit-collection">Collection</label>
            <input id="edit-collection" type="text" autocapitalize="none" spellcheck="false" />
          </div>
          <div class="field">
            <label for="edit-count">Count</label>
            <input id="edit-count" type="number" inputmode="numeric" min="1" />
          </div>
          <div class="field">
            <label for="edit-price">Price</label>
            <input id="edit-price" type="number" inputmode="decimal" min="0" step="any" />
          </div>
          <div class="field field-check">
            <label><input id="edit-for-sale" type="checkbox" /> For sale</label>
          </div>
          <div class="field field-wide">
            <label for="edit-description">Description</label>
            <input id="edit-description" type="text" />
          </div>
          <div class="field field-wide">
            <label for="edit-linked">Linked tags (comma-separated)</label>
            <input id="edit-linked" type="text" autocapitalize="none" spellcheck="false" />
          </div>
          <div class="field field-wide">
            <label for="edit-references">Book references (one per line: Title | Authors | ISBN | Page)</label>
            <textarea id="edit-references" rows="3" autocapitalize="none" spellcheck="false"></textarea>
          </div>
          <div class="field field-wide">
            <label for="edit-body">Body (Markdown)</label>
            <textarea id="edit-body" rows="10"></textarea>
          </div>
        </div>
        <p id="status-edit" class="status" role="status"></p>
        <button id="edit-save" type="button">Save changes</button>
      </section>

      <!-- ============================ CREATE SCREEN =========================== -->
      <section id="screen-create" class="screen hidden">
        <header class="app-header">
          <button id="create-cancel" class="ghost" type="button">← Cancel</button>
          <h1 class="screen-title">New tag</h1>
        </header>
        <div class="settings">
          <div class="field field-wide">
            <label for="new-species">Species name</label>
            <input id="new-species" type="text" autocapitalize="none" spellcheck="false" />
          </div>
          <div class="field">
            <label for="new-species-inat">Species iNat ID</label>
            <input id="new-species-inat" type="number" inputmode="numeric" min="0" />
          </div>
          <div class="field">
            <label for="new-collection">Collection</label>
            <input id="new-collection" type="text" autocapitalize="none" spellcheck="false" />
          </div>
          <div class="field field-wide">
            <label for="new-observation">Observation iNat ID (fills species)</label>
            <div class="field-inline">
              <input id="new-observation" type="number" inputmode="numeric" min="0" />
              <button id="lookup" class="ghost" type="button">Look up</button>
            </div>
          </div>
          <div class="field field-wide">
            <label for="new-description">Description</label>
            <input id="new-description" type="text" />
          </div>
          <div class="field">
            <label for="new-count">Count</label>
            <input id="new-count" type="number" inputmode="numeric" min="1" />
          </div>
          <div class="field">
            <label for="new-price">Price</label>
            <input id="new-price" type="number" inputmode="decimal" min="0" step="any" />
          </div>
          <div class="field field-check">
            <label><input id="new-for-sale" type="checkbox" /> For sale</label>
          </div>
          <div class="field field-check">
            <label><input id="new-write-nfc" type="checkbox" checked /> Write NFC after create</label>
          </div>
        </div>
        <p id="status-create" class="status" role="status"></p>
        <button id="create" type="button">Create tag</button>
      </section>

      <!-- ============================ CONFIG SCREEN =========================== -->
      <section id="screen-config" class="screen hidden">
        <header class="app-header">
          <button id="config-back" class="ghost" type="button">← Back</button>
          <h1 class="screen-title">Configuration</h1>
        </header>
        <div class="settings">
          <div class="field">
            <label for="owner">Owner</label>
            <input id="owner" type="text" autocapitalize="none" spellcheck="false" />
          </div>
          <div class="field">
            <label for="repo">Repo</label>
            <input id="repo" type="text" autocapitalize="none" spellcheck="false" />
          </div>
          <div class="field">
            <label for="branch">Branch</label>
            <input id="branch" type="text" autocapitalize="none" spellcheck="false" />
          </div>
          <div class="field">
            <label for="domain">Domain</label>
            <input id="domain" type="text" autocapitalize="none" spellcheck="false" />
          </div>
          <div class="field field-wide">
            <label for="token">GitHub token (needed to create/edit tags)</label>
            <input id="token" type="password" autocapitalize="none" spellcheck="false" />
          </div>
        </div>
        <p id="status-config" class="status" role="status"></p>
        <div class="stack-actions">
          <button id="load-config" class="ghost" type="button">Load from chnm.toml</button>
          <button id="config-save" type="button">Save</button>
        </div>
      </section>

      <!-- ========================== WRITE NFC OVERLAY ======================== -->
      <div id="write-overlay" class="overlay hidden">
        <div class="overlay-card">
          <h2>Write to NFC</h2>
          <p class="overlay-target"><span id="write-url" class="overlay-url"></span></p>
          <p class="write-counter">Written: <span id="write-count">0</span></p>
          <p id="status-write" class="status" role="status"></p>
          <button id="write-done" type="button">Done</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
